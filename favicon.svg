<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="url(#gold)" filter="url(#shadow)"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#b45309" stroke-width="1.5" opacity="0.5"/>
  <!-- Shine -->
  <circle cx="32" cy="32" r="29" fill="url(#shine)"/>
  <!-- ISK text -->
  <text x="32" y="38" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#78350f" letter-spacing="1">ISK</text>
  <!-- Small stars -->
  <circle cx="18" cy="20" r="1.5" fill="#fde68a" opacity="0.8"/>
  <circle cx="46" cy="44" r="1" fill="#fde68a" opacity="0.6"/>
</svg>
